name: Renovar token de Instagram

# El token de Instagram vence a los 60 días. Este proceso lo renueva
# el día 1 de cada mes y guarda el nuevo en el secreto IG_TOKEN.
# Necesita el secreto GH_PAT (token de GitHub con permiso "Secrets: Read and write").

on:
  schedule:
    - cron: "17 12 1 * *"
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar y guardar token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Falta el secreto GH_PAT, no se puede guardar el token renovado."
            exit 1
          fi
          RESPUESTA=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_TOKEN}")
          NUEVO=$(echo "$RESPUESTA" | jq -r '.access_token // empty')
          if [ -z "$NUEVO" ]; then
            echo "Instagram no devolvió un token nuevo:"
            echo "$RESPUESTA" | jq '.error // .'
            exit 1
          fi
          echo "::add-mask::$NUEVO"
          gh secret set IG_TOKEN --body "$NUEVO" --repo "${{ github.repository }}"
          echo "Token renovado. Vence en $(( $(echo "$RESPUESTA" | jq -r '.expires_in') / 86400 )) días."
