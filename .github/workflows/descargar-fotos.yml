name: Descargar fotos de productos

on:
  push:
    paths:
      - "disenos/productos/pedido.txt"
      - "disenos/descargar_fotos.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python disenos/descargar_fotos.py
      - name: Guardar fotos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898694+github-actions[bot]@users.noreply.github.com"
          git add disenos/productos
          git diff --cached --quiet || git commit -m "Fotos de productos descargadas"
          git push
